# pl_contracts: Python validator, fixture checker and contract linter (owner: LNX).
[project]
name = "pl-contracts"
version = "0.0.0"
description = "PrivacyLens contract tools"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.23", "rfc3339-validator>=0.1.4"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pl_contracts"]
