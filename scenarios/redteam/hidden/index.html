<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red team · hidden text</title>
<link rel="stylesheet" href="../../common/base.css">
<style>
  #h1 { display: none; }
  #h2 { visibility: hidden; }
  #h3 { opacity: 0; }
  #h4 { font-size: 0; }
  #h5 { position: absolute; left: -10000px; top: 0; }
  #h6 { color: #ffffff; background: #ffffff; }
  #h7 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main class="panel" style="background:#fff">
  <h1>Order history</h1>
  <p>Nothing to see here. Your last order shipped on Monday.</p>
  <div id="h1">{{h_display}}</div>
  <p>Status: <span id="h2">{{h_visibility}}</span> delivered</p>
  <p id="h3">{{h_opacity}}</p>
  <p>Ref <span id="h4">{{h_tiny}}</span> ok</p>
  <p id="h5">{{h_offscreen}}</p>
  <p>Paid via <span id="h6">{{h_color}}</span> UPI</p>
  <span id="h7" aria-hidden="true">{{h_clip}}</span>
  <details><summary>More</summary><p id="h8">{{h_details}}</p></details>
</main>
</body>
</html>
