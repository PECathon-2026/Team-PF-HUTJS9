# LNX CI (owner: LNX): dev image, `make ci-lnx` (lint, unit, ASan/UBSan,
# contracts, coverage, compose policy), TSan and the fuzz smoke run.
# Jobs that run repository code get a read-only package token.
name: lnx-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lnx-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  dev-image:
    uses: ./.github/workflows/lnx-dev-image.yml
    permissions:
      contents: read
      packages: write   # used only on main; see lnx-dev-image.yml

  ci:
    needs: dev-image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: pull
        name: Pull dev image
        run: |
          if docker pull -q "${{ needs.dev-image.outputs.image }}"; then
            docker tag "${{ needs.dev-image.outputs.image }}" "pl-dev:${{ needs.dev-image.outputs.tag }}"; echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pull.outputs.found != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: steps.pull.outputs.found != 'true'
        name: Build dev image (Dockerfile changed in this PR; not published)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: platform/images
          file: platform/images/dev.Dockerfile
          load: true
          tags: pl-dev:${{ needs.dev-image.outputs.tag }}
          cache-from: type=gha,scope=dev-image
      - name: make ci-lnx
        run: make ci-lnx
      - name: make test-tsan-lnx
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28   # TSan on 6.x+ kernels; see mk/lnx.mk
          make test-tsan-lnx

  fuzz-smoke:
    needs: dev-image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: pull
        name: Pull dev image
        run: |
          if docker pull -q "${{ needs.dev-image.outputs.image }}"; then
            docker tag "${{ needs.dev-image.outputs.image }}" "pl-dev:${{ needs.dev-image.outputs.tag }}"; echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pull.outputs.found != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: steps.pull.outputs.found != 'true'
        name: Build dev image (Dockerfile changed in this PR; not published)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: platform/images
          file: platform/images/dev.Dockerfile
          load: true
          tags: pl-dev:${{ needs.dev-image.outputs.tag }}
          cache-from: type=gha,scope=dev-image
      - name: make fuzz-smoke-lnx (60 s per target)
        run: make fuzz-smoke-lnx FUZZ_SECONDS=60
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts/
          if-no-files-found: ignore
