# Path ownership on pull requests (owner: LNX, SHARED.md §3/§4).
# lnx/* branches may only touch LNX paths, win/* only WIN paths, user/* only
# USER paths; any other branch name fails. The checker and the rules are taken
# from the base branch, so a PR can't loosen the check it is judged by.
name: ownership

on:
  pull_request:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check changed paths against tools/ownership.tsv
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q origin "$BASE_REF"
          if git cat-file -e "origin/$BASE_REF:tools/hooks/pl_hook.py" 2>/dev/null; then
            git show "origin/$BASE_REF:tools/hooks/pl_hook.py" > "$RUNNER_TEMP/pl_hook.py"
          else
            cp tools/hooks/pl_hook.py "$RUNNER_TEMP/pl_hook.py"   # bootstrap: checker not on base yet
          fi
          python3 "$RUNNER_TEMP/pl_hook.py" ci --base "origin/$BASE_REF" --head "$HEAD_SHA" --branch "$HEAD_REF"
