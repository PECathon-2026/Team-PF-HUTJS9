# Path ownership + secret scan on pull requests (owner: LNX, SHARED.md §3/§4).
# lnx/* branches may only touch LNX paths, win/* only WIN paths, user/* only
# USER paths; any other branch name fails.
#
# pull_request_target: this workflow file, the checker (tools/hooks/pl_hook.py)
# and the rules all come from the BASE branch, so a PR can't edit the check it
# is judged by. The PR head is fetched as data only: no code from it is run,
# and the job's token is read-only.
name: ownership

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (base branch)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head (data only)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch -q --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/pr-head" && test "$(git rev-parse refs/pr-head)" = "$HEAD_SHA"
      - name: Check changed paths against the base branch's tools/ownership.tsv
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 tools/hooks/pl_hook.py ci --base "$BASE_SHA" --head refs/pr-head --branch "$HEAD_REF"
      - name: gitleaks over the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          # Built-in rules only (an empty config path is never read from the PR head:
          # .gitleaks.toml / .gitleaksignore are unowned paths, so a PR can't add them).
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$(git merge-base "$BASE_SHA" refs/pr-head)..refs/pr-head" .
