# Builds and publishes the pinned dev image (owner: LNX, AD-03/AD-15).
# Tag = first 16 hex chars of sha256(platform/images/dev.Dockerfile), the same
# hash the Makefile computes, so `make dev-image` pulls exactly this build.
# Publishing happens only from main (push or manual run); pull requests never
# get a package-write token. A PR that changes the Dockerfile builds the image
# inside its CI jobs instead (lnx-ci.yml, "Pull or build dev image").
# Actions are pinned by commit SHA (tag in the comment).
name: lnx-dev-image

on:
  workflow_call:
    outputs:
      image:
        description: Fully qualified dev image reference
        value: ${{ jobs.build.outputs.image }}
      tag:
        description: Dockerfile hash tag
        value: ${{ jobs.build.outputs.tag }}
  push:
    branches: [main]
    paths: [platform/images/dev.Dockerfile, .github/workflows/lnx-dev-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: |
          tag=$(sha256sum platform/images/dev.Dockerfile | cut -c1-16)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/pecathon-2026/team-pf-hutjs9/dev:$tag" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        if: github.event_name != 'pull_request'
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "already published: ${{ steps.meta.outputs.image }}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name != 'pull_request' && steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: github.event_name != 'pull_request' && steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: platform/images
          file: platform/images/dev.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/PECathon-2026/Team-PF-HUTJS9
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image
