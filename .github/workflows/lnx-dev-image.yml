# Builds and publishes the pinned dev image (owner: LNX, AD-03/AD-15).
# Tag = first 16 hex chars of sha256(platform/images/dev.Dockerfile), the same
# hash the Makefile computes, so `make dev-image` pulls exactly this build.
name: lnx-dev-image

on:
  workflow_call:
    outputs:
      image:
        description: Fully qualified dev image reference
        value: ${{ jobs.build.outputs.image }}
      tag:
        description: Dockerfile hash tag
        value: ${{ jobs.build.outputs.tag }}
  push:
    branches: [main]
    paths: [platform/images/dev.Dockerfile, .github/workflows/lnx-dev-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          tag=$(sha256sum platform/images/dev.Dockerfile | cut -c1-16)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/pecathon-2026/team-pf-hutjs9/dev:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "already published: ${{ steps.meta.outputs.image }}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: platform/images
          file: platform/images/dev.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/PECathon-2026/Team-PF-HUTJS9
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image
